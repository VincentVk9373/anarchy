name: Build, Zip and Release 

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger the workflow on version tags

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
      packages: write
      pull-requests: write
      repository-projects: write

    steps:
    - name: Check out the code
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'  # Use the node version your project requires
        package-manager-cache: false 

    - name: Install dependencies
      run: npm install

    - name: Build the application
      run: npx vite build

    - name: Build the compendiums
      run: node ./tools/packCompendiumsToDist.mjs

    - name: Archive dist directory
      run: |
        VERSION=$(git describe --tags --abbrev=0)
        zip -r foundry-anarchy-$VERSION.zip dist

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1.1.4
      env:
        GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1.0.2
      env:
        GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./foundry-anarchy-${{ github.ref_name }}.zip
        asset_name: foundry-anarchy-${{ github.ref_name }}.zip
        asset_content_type: application/zip

